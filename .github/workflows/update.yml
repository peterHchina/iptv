name: Update

on:
  workflow_dispatch:
  watch:
    types: [started]
  schedule:
    - cron: 50 * * * *
    

env:
  TZ: Asia/Shanghai

jobs:
  Update:
    runs-on: ubuntu-latest
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 3

    - name: GetTime
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Update
      run: |
        # 容错下载：下载到临时文件，成功才覆盖目标；失败时保留旧源并告警，不中断流程
        fetch() {
          local url="$1" out="$2"
          rm -f "$out.new"
          if wget -q --tries=2 --timeout=30 "$url" -O "$out.new" && [ -s "$out.new" ]; then
            mv -f "$out.new" "$out"
          else
            rm -f "$out.new"
            [ -f "$out" ] || touch "$out"
            echo "::warning::$out 下载失败，保留旧源"
          fi
        }

        # 国内IPV6-TV源
        fetch https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u IPTV-V6.m3u
        cp IPTV-V6.m3u CCTV-V6.m3u && sed -i -n '/央视频道/,+1p' CCTV-V6.m3u
        sed -i '1i #EXTM3U' CCTV-V6.m3u
        sed -i '/^\s*$/d' CCTV-V6.m3u

        rm -f CNTV-V6.m3u CNTV1.m3u CNTV2.m3u CNTV3.m3u && touch CNTV-V6.m3u
        cp IPTV-V6.m3u CNTV1.m3u && sed -i -n '/卫视频道/,+1p' CNTV1.m3u
        cp IPTV-V6.m3u CNTV2.m3u && sed -i -n '/NewTV系列/,+1p' CNTV2.m3u
        cp IPTV-V6.m3u CNTV3.m3u && sed -i -n '/超清频道/,+1p' CNTV3.m3u

        cat CCTV-V6.m3u CNTV1.m3u CNTV2.m3u CNTV3.m3u >> CNTV-V6.m3u
        rm -f CNTV1.m3u CNTV2.m3u CNTV3.m3u
        sed -i '/#EXTM3U/d' CNTV-V6.m3u
        sed -i '1i #EXTM3U' CNTV-V6.m3u
        sed -i '/^\s*$/d' CNTV-V6.m3u

        # 国内IPV4-TV源（原ottiptv签名链接已过期403，注释备查；下载失败时自动沿用旧源）
        # fetch "https://live.ottiptv.cc/iptv.m3u?userid=5559462299&sign=fdc9db1303aff74ac65285abb0dee2d00411f8e8d449fb6d4ae3a089a6945ea3a94f31c0780518c1a9688f576455e238e4955b269a75815ac194393c330ed754931f32db86d812&auth_token=1b99577efa5a3442ca4c7820d6e0b4e8" IPTV-V4.m3u
        fetch https://live.zbds.top/tv/iptv4.m3u IPTV-V4.m3u
        rm -f CCTV-V4.m3u && touch CCTV-V4.m3u
        cat IPTV-V4.m3u >> CCTV-V4.m3u && sed -i -n '/央视/,+1p' CCTV-V4.m3u 
        sed -i '1i #EXTM3U x-tvg-url="https://11.112114.xyz/pp.xml"' CCTV-V4.m3u
        sed -i '/^\s*$/d' CCTV-V4.m3u

        rm -f CNTV-V4.m3u CNTV1.m3u CNTV2.m3u CNTV3.m3u && touch CNTV-V4.m3u
        cat IPTV-V4.m3u >> CNTV1.m3u && sed -i -n '/卫视/,+1p' CNTV1.m3u
        cat IPTV-V4.m3u >> CNTV2.m3u && sed -i -n '/地方/,+1p' CNTV2.m3u
        cat IPTV-V4.m3u >> CNTV3.m3u && sed -i -n '/电影/,+1p' CNTV3.m3u

        cat CCTV-V4.m3u CNTV1.m3u CNTV2.m3u CNTV3.m3u >> CNTV-V4.m3u
        rm -f CNTV1.m3u CNTV2.m3u CNTV3.m3u
        sed -i '/#EXTM3U/d' CNTV-V4.m3u
        sed -i '1i #EXTM3U x-tvg-url="https://11.112114.xyz/pp.xml"' CNTV-V4.m3u
        sed -i '/^\s*$/d' CNTV-V4.m3u

        # 成人源
        # rm -f Adult.m3u && wget http://adultiptv.net/chs.m3u -O Adult.m3u
        # sed -i 's/XXX/成人频道/' Adult.m3u
        # sed -i 's/AdultIPTV.net //g' Adult.m3u
        # wget https://yang-1989.eu.org/m3u/Adult -O AdultVideo.txt
        # # sed -i -n '/日本/,+1p' AdultVideo.txt
        # # sed -i 's/日本/成人视频/' AdultVideo.txt
        # echo '' >> Adult.m3u && cat AdultVideo.txt >> Adult.m3u
        # rm -f AdultVideo.txt
        # sed -i '/#EXTM3U/d' Adult.m3u
        # sed -i '1i #EXTM3U' Adult.m3u
        # sed -i '/^\s*$/d' Adult.m3u


        # 直播源
        fetch https://bit.ly/IPTV-Gather Live.m3u
        sed -i '/#EXTM3U/d' Live.m3u
        sed -i '1i #EXTM3U' Live.m3u
        sed -i '/^\s*$/d' Live.m3u


        # 虎牙一起看
        fetch https://sub.ottiptv.cc/huyayqk.m3u huyayqk.m3u
        sed -i '/#EXTM3U/d' huyayqk.m3u && sed -i '1i #EXTM3U' huyayqk.m3u && sed -i '/^\s*$/d' huyayqk.m3u

        # 斗鱼一起看
        fetch https://sub.ottiptv.cc/douyuyqk.m3u douyuyqk.m3u
        sed -i '/#EXTM3U/d' douyuyqk.m3u && sed -i '1i #EXTM3U' douyuyqk.m3u && sed -i '/^\s*$/d' douyuyqk.m3u

        # bilibili直播
        fetch https://sub.ottiptv.cc/bililive.m3u bililive.m3u
        sed -i '/#EXTM3U/d' bililive.m3u && sed -i '1i #EXTM3U' bililive.m3u && sed -i '/^\s*$/d' bililive.m3u

        # YY轮播
        fetch https://sub.ottiptv.cc/yylunbo.m3u yylunbo.m3u
        sed -i '/#EXTM3U/d' yylunbo.m3u && sed -i '1i #EXTM3U' yylunbo.m3u && sed -i '/^\s*$/d' yylunbo.m3u


        # # 全网源
        # 节目源
        fetch https://epg.112114.xyz/pp.xml EPG.xml
        echo "Auto Update in ${{ steps.date.outputs.date }}
        ## 注意！使用V4源时需配置代理，可仿照APTV进行配置

        电视节目源订阅地址（TV源）：

        节目单订阅地址：https://peterhchina.github.io/iptv/EPG.xml
        
        IPV6-TV源

        央视频道源：https://peterhchina.github.io/iptv/CCTV-V6.m3u  

        央视+卫视+地方+影视源：https://peterhchina.github.io/iptv/CNTV-V6.m3u  

        全部V6-TV源：https://peterhchina.github.io/iptv/IPTV-V6.m3u

        IPV4-TV源

        央视频道源：https://peterhchina.github.io/iptv/CCTV-V4.m3u  

        央视+卫视+地方+电影源：https://peterhchina.github.io/iptv/CNTV-V4.m3u  

        全部V4-TV源：https://peterhchina.github.io/iptv/IPTV-V4.m3u

        网络直播订阅地址：
        
        虎牙一起看：https://peterhchina.github.io/iptv/huyayqk.m3u  

        斗鱼一起看：https://peterhchina.github.io/iptv/douyuyqk.m3u  

        bilibili直播：https://peterhchina.github.io/iptv/bililive.m3u  

        YY轮播：https://peterhchina.github.io/iptv/yylunbo.m3u  

        其他直播源大合集：https://peterhchina.github.io/iptv/Live.m3u  

        *自定义header：User-Agent=okHttp/Mursor-1.4.0.0
        
        ![image](https://github.com/peterHchina/iptv/blob/main/src/VC20250811-092617.png)
        ![image](https://github.com/peterHchina/iptv/blob/main/src/VC20250811-100707.jpg)

        ## Star History
        <a href='https://star-history.com/#peterHchina/iptv&Date'>
        <picture>
        <source media='(prefers-color-scheme: dark)' srcset='https://api.star-history.com/svg?repos=peterHchina/iptv&type=Date&theme=dark' />
        <source media='(prefers-color-scheme: light)' srcset='https://api.star-history.com/svg?repos=peterHchina/iptv&type=Date' />
        <img alt='Star History Chart' src='https://api.star-history.com/svg?repos=peterHchina/iptv&type=Date' />
        </picture>
        </a>" > README.md

    - name: Clean
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git checkout --orphan latest_branch
        git add -A
        git commit -am "${{ steps.date.outputs.date }}"
        git branch -D main
        git branch -m main
    - name: Push
      run: git push -f origin main
